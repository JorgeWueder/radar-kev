name: radar

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      RADAR_DB_PASSWORD: ${RADAR_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      LANGFLOW_DB_PASSWORD: ${LANGFLOW_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *restart
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://radar_app:${RADAR_DB_PASSWORD}@postgres:5432/radar
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    <<: *restart
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  n8n-import:
    image: n8nio/n8n:3.1.0
    restart: "no"
    entrypoint: ["/bin/sh", "/import.sh"]
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Lima}
      TZ: ${GENERIC_TIMEZONE:-America/Lima}
      # Los workflows leen estas variables ($env); n8n NO recibe credenciales de la base radar.
      RADAR_SERVICE_KEY: ${RADAR_SERVICE_KEY}
      RADAR_API_URL: http://backend:8000/api/v1
      KEV_URL: ${KEV_URL}
      EPSS_API_URL: ${EPSS_API_URL}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./n8n/workflows:/workflows:ro
      - ./n8n/import.sh:/import.sh:ro

  n8n:
    <<: *restart
    image: n8nio/n8n:3.1.0
    environment: *n8n-env
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  langflow:
    <<: *restart
    image: langflowai/langflow:1.13.0
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:${LANGFLOW_DB_PASSWORD}@postgres:5432/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      # El flow ticket_enrichment (langflow/flows) se carga solo al arrancar y llama a Ollama por su nombre de servicio.
      LANGFLOW_LOAD_FLOWS_PATH: /flows
      LANGFLOW_LOAD_FLOWS_OVERWRITE_ON_NAME_MATCH: "true"
      LANGFLOW_SSRF_ALLOWED_HOSTS: ollama
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    volumes:
      - ./langflow/flows:/flows:ro

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"

  # LLM local (proveedor por defecto). Perfil "ollama": activo con COMPOSE_PROFILES=ollama en .env.
  # Con GPU NVIDIA: añada docker-compose.gpu.yml (ver .env.example, variable COMPOSE_FILE).
  ollama:
    <<: *restart
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Descarga una sola vez el modelo configurado en LLM_MODEL (queda en el volumen "ollama").
  ollama-pull:
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
  ollama:
